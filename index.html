<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6f2, #ffd6ea, #fff0f7);
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Card */
        .welcome-card {
            width: 460px;
            max-width: 90%;
            background: rgba(255, 255, 255, .88);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255, 105, 180, .25);
            z-index: 10;
            position: relative;
        }

        .cake {
            font-size: 75px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 38px;
            color: #ff5f9e;
            margin: 20px 0;
        }

        p {
            color: #777;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* Countdown Styles */
        .countdown {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .box {
            width: 22%;
            background: #fff3f8;
            padding: 12px 5px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 192, 203, .25);
        }

        .number {
            font-size: 24px;
            font-family: 'Fredoka One';
            color: #ff5f9e;
        }

        .label {
            font-size: 11px;
            color: #ff8ab8;
            text-transform: uppercase;
            margin-top: 3px;
            font-weight: 700;
        }

        /* Button */
        .start-btn {
            display: block;
            background: linear-gradient(45deg, #ff6ba6, #ff8fc2);
            color: white;
            padding: 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(255, 105, 180, .35);
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 30px rgba(255, 105, 180, .45);
        }

        /* =========================================
            PRINCESS DOORS (Start Open)
        ========================================= */
        .door {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                #ffd4e5,
                #ffbdd8,
                #ff9fc5,
                #ffbdd8,
                #ffd4e5
            );
            box-shadow:
                inset 0 0 60px rgba(255, 255, 255, .45),
                0 0 40px rgba(255, 182, 193, .45);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 9999;
            will-change: transform;
        }

        /* Left Door - Starts fully translated out of screen to the left */
        .left-door {
            left: 0;
            border-right: 6px solid white;
            transform: translateX(-100%);
        }

        /* Right Door - Starts fully translated out of screen to the right */
        .right-door {
            right: 0;
            border-left: 6px solid white;
            transform: translateX(100%);
        }

        /* Decorative Panel */
        .door::before {
            content: "";
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border: 5px solid rgba(255, 255, 255, .5);
            border-radius: 30px;
            background: rgba(255, 255, 255, .08);
        }

        /* Tombol Pintu (Door Knobs) Styles */
        .left-door::after,
        .right-door::after {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 55px;
            background: linear-gradient(135deg, #fff, #ffb6c1);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15), inset 0 2px 3px rgba(255, 255, 255, 0.8);
            border: 2px solid #ff8fab;
        }

        .left-door::after {
            right: 30px;
        }

        .right-door::after {
            left: 30px;
        }

        /* Close Doors Action */
        body.closeDoor .left-door {
            transform: translateX(0);
        }

        body.closeDoor .right-door {
            transform: translateX(0);
        }
    </style>
</head>

<body>

    <div class="left-door door"></div>
    <div class="right-door door"></div>

    <div class="welcome-card">
        <div class="cake">🎂</div>
        <h1>A Special Surprise Awaits!</h1>
        <p>
            Hi! I made something special just for you.
            When the countdown ends, Click the button below to enter! 
        </p>

        <!-- Countdown Container -->
        <div class="countdown">
            <div class="box">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box">
                <div class="number" id="minutes">00</div>
                <div class="label">Mins</div>
            </div>
            <div class="box">
                <div class="number" id="seconds">00</div>
                <div class="label">Secs</div>
            </div>
        </div>

        <a href="#" class="start-btn" id="enterBtn">
            Open Your Surprise 
        </a>
    </div>

    <script>
        // Birthday Countdown Script
        const birthdayTarget = new Date("Aug 22, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = birthdayTarget - now;

            if (difference <= 0) {
                document.getElementById("days").innerHTML = "00";
                document.getElementById("hours").innerHTML = "00";
                document.getElementById("minutes").innerHTML = "00";
                document.getElementById("seconds").innerHTML = "00";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = d.toString().padStart(2, "0");
            document.getElementById("hours").innerHTML = h.toString().padStart(2, "0");
            document.getElementById("minutes").innerHTML = m.toString().padStart(2, "0");
            document.getElementById("seconds").innerHTML = s.toString().padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Door Closing & Transition Script
        const enterBtn = document.getElementById("enterBtn");

        enterBtn.addEventListener("click", function(e) {
            e.preventDefault();
            enterBtn.innerHTML = "Closing Doors & Entering...";
            enterBtn.style.pointerEvents = "none";

            // Close doors smoothly
            document.body.classList.add("closeDoor");

            // Instantly go to memories page once doors shut
            setTimeout(() => {
                window.location.href = "memories.html";
            }, 1200);
        });
    </script>

</body>
</html>
